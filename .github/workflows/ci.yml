name: Payment Service CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  # Giai đoạn 1: Job kiểm thử (Unit Test)
  test_job:
    runs-on: [self-hosted, quickbite]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew
          ./gradlew test

  # Giai đoạn 2: Job build (Chỉ chạy khi test_job thành công)
  build_job:
    needs: test_job # Cơ chế Job Isolation & Sequential Workflow: Bắt buộc test_job phải Passed thì job này mới chạy
    runs-on: [self-hosted, quickbite]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cấp quyền thực thi Gradle Wrapper và Build Jar
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-artifact
          path: build/libs/*.jar
          retention-days: 3
